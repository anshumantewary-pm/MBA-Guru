<body>
  <!-- Painterly edge filter used by the clouds and rocks. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feGaussianBlur in="warp" stdDeviation="1.4"/>
    </filter>
  </svg>

  <header class="topbar">

  </header>
